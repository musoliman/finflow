
server:
  port: 8082
spring:
  application:
    name: account-service
  datasource: { url: { username: postgres, password: postgres, driver-class-name: org.postgresql.Driver }, jpa: { hibernate: { ddl-auto: create-drop }, show-sql: true, properties: { hibernate: { dialect: org.postgresql.dialect.PostgreSQLDialect } } } }
